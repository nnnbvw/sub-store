Anchor_PR: &Anchor_PR {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.g.cn/generate_204', interval: 300}, filter: "^(?!.*(到期|过期|剩余|网址|官网|邮箱|订阅|套餐|流量|说明|重置)).*$"}
Anchor_OB: &Anchor_OB {type: select, proxies: [一键代理, 香港节点, 日本节点, 马来西亚节点, 韩国节点, 新加坡节点, 美国节点,  其他手动, DIRECT, REJECT]}
Anchor_HS: &Anchor_HS {type: select, include-all: true}
Anchor_FB: &Anchor_FB {type: fallback, url: 'https://www.g.cn/generate_204', interval: 300, lazy: false, timeout: 2000, max-failed-times: 3, hidden: true}
Anchor_UT: &Anchor_UT {type: url-test, url: 'https://www.g.cn/generate_204', interval: 300, lazy: false, tolerance: 50, timeout: 2000, max-failed-times: 3, hidden: true, include-all: true}
Anchor_HK: &Anchor_HK '^(?i)(?=.*(香港|🇭🇰|\bHK\b|Hong(?:\s?Kong)?|HKG)).*$'
Anchor_JP: &Anchor_JP '^(?i)(?=.*(日本|🇯🇵|\bJP\b|Japan|NRT|HND|KIX|CTS|FUK)).*$'
Anchor_MY: &Anchor_MY '^(?i)(?=.*(马来西亚|馬來西亞|🇲🇾|\bMY\b|KUL|JHB|PEN|BKI|KCH)).*$'
Anchor_KR: &Anchor_KR '^(?i)(?=.*(韩国|韓國|🇰🇷|首尔|首爾|\bKR\b|\bKOR\b|Korea|Seoul|South)).*$'
Anchor_SG: &Anchor_SG '^(?i)(?=.*(新加坡|🇸🇬|\bSG\b|Singapore|SIN|XSP)).*$'
Anchor_US: &Anchor_US '^(?i)(?=.*(美国|美國|🇺🇸|\bUS\b|\bUSA\b|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD)).*$'
Anchor_OT: &Anchor_OT '^(?!.*(DIRECT|直接连接|香港|日本|马来西亚|韩国|韓國|新加坡|美国|美國|英国|🇭🇰|🇹🇼|🇸🇬|🇯🇵|🇰🇷|🇺🇸|🇬🇧|HK|TW|MY|SG|JP|KR|US|GB|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU|HKG|TPE|TSA|KHH|SIN|XSP|NRT|HND|KIX|CTS|FUK|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|LHR|LGW)).*$'
Anchor_IP: &Anchor_IP {type: http, interval: 86400, behavior: ipcidr, format: mrs}
Anchor_DN: &Anchor_DN {type: http, interval: 86400, behavior: domain, format: mrs}
Anchor_CL: &Anchor_CL {type: http, interval: 86400, behavior: classical, format: text}

mixed-port: 7893
mode: rule
allow-lan: true
bind-address: "*"
tcp-concurrent: true
unified-delay: true
log-level: info
ipv6: true
profile:
  store-selected: true
  store-fake-ip: true
external-ui-name: zashboard
external-ui: ui
external-controller: 0.0.0.0:9090
secret: ""
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-no-fonts.zip
tun:
  enable: true
  stack: system
  auto-detect-interface: true
  auto-route: true
  auto-redirect: true
  strict-route: false
  endpoint-independent-nat: true
sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    QUIC:
      ports: [443]
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - "+.apple.com"
    - Mijia Cloud
    - dlg.io.mi.com
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  respect-rules: false
  fake-ip-filter:
    - '*.lan'
    - "rule-set:cn_domain"
  default-nameserver:
    - 219.141.136.10                                                   
    - 219.141.140.10
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
proxy-groups:
  - {name: 一键代理, type: select, include-all: true, proxies: [香港节点, 日本节点, 马来西亚节点, 韩国节点, 新加坡节点, 美国节点,  其他手动, DIRECT, REJECT], icon: https://github.com/Seven1echo/Yaml/raw/main/icons/Rocket.png}
  - {name: YouTube,   <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/YouTube.png}
  - {name: Google,    <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/Google.png}
  - {name: ChatGPT,   <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/ChatGPT.png}
  - {name: GitHub,    <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/GitHub.png}
  - {name: OneDrive,  <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/OneDrive.png}
  - {name: Microsoft, <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/Microsoft.png}
  - {name: AppleTV,   <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/AppleTV.png}
  - {name: Apple,     <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/Apple.png}
  - {name: Apple Ai,  <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/Apple.png}
  - {name: TikTok,    <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/TikTok.png}
  - {name: Twitter,   <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/Twitter.png}
  - {name: Telegram,  <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/Telegram.png}
  - {name: Netflix,   <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/Netflix.png}
  - {name: Disney,    <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/Disney.png}
  - {name: Spotify,   <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/Spotify.png}
  - {name: PayPal,    <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/PayPal.png}
  - {name: Bybit,    <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/MATCH.png}
  - {name: Speedtest, <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/Speedtest.png}
  - {name: 漏网之鱼,   <<: *Anchor_OB, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/MATCH.png}
  - name: 香港节点
    type: select
    include-all: true
    filter: *Anchor_HK
    proxies: [香港自动, 香港故转]
    icon: https://github.com/Seven1echo/Yaml/raw/main/icons/HK.png
  - name: 日本节点
    type: select
    include-all: true
    filter: *Anchor_JP
    proxies: [日本自动, 日本故转]
    icon: https://github.com/Seven1echo/Yaml/raw/main/icons/JP.png
  - name: 马来西亚节点
    type: select
    include-all: true
    filter: *Anchor_MY
    proxies: [马来西亚自动, 马来西亚故转]
    icon: https://flagcdn.com/w40/my.png
  - name: 韩国节点
    type: select
    include-all: true
    filter: *Anchor_KR
    proxies: [韩国自动, 韩国故转]
    icon: https://github.com/Seven1echo/Yaml/raw/main/icons/KR.png
  - name: 新加坡节点
    type: select
    include-all: true
    filter: *Anchor_SG
    proxies: [新加坡自动, 新加坡故转]
    icon: https://github.com/Seven1echo/Yaml/raw/main/icons/SG.png
  - name: 美国节点
    type: select
    include-all: true
    filter: *Anchor_US
    proxies: [美国自动, 美国故转]
    icon: https://github.com/Seven1echo/Yaml/raw/main/icons/US.png
  - {name: 香港故转, <<: *Anchor_FB, include-all: true, filter: *Anchor_HK, hidden: true}
  - {name: 香港自动, <<: *Anchor_UT, include-all: true, filter: *Anchor_HK, hidden: true}
  - {name: 日本故转, <<: *Anchor_FB, include-all: true, filter: *Anchor_JP, hidden: true}
  - {name: 日本自动, <<: *Anchor_UT, include-all: true, filter: *Anchor_JP, hidden: true}
  - {name: 马来西亚故转, <<: *Anchor_FB, include-all: true, filter: *Anchor_MY, hidden: true}
  - {name: 马来西亚自动, <<: *Anchor_UT, include-all: true, filter: *Anchor_MY, hidden: true}
  - {name: 韩国故转, <<: *Anchor_FB, include-all: true, filter: *Anchor_KR, hidden: true}
  - {name: 韩国自动, <<: *Anchor_UT, include-all: true, filter: *Anchor_KR, hidden: true}
  - {name: 新加坡故转, <<: *Anchor_FB, include-all: true, filter: *Anchor_SG, hidden: true}
  - {name: 新加坡自动, <<: *Anchor_UT, include-all: true, filter: *Anchor_SG, hidden: true}
  - {name: 美国故转, <<: *Anchor_FB, include-all: true, filter: *Anchor_US, hidden: true}
  - {name: 美国自动, <<: *Anchor_UT, include-all: true, filter: *Anchor_US, hidden: true}
  - {name: 其他手动, <<: *Anchor_HS, filter: *Anchor_OT, icon: https://github.com/Seven1echo/Yaml/raw/main/icons/OT.png}
